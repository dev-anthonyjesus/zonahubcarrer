.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sticker{padding:10px;border:1px solid #272727;border-radius:12px;background:#0d0d0d;text-align:center;cursor:pointer}.sticker:hover{border-color:#49573d;box-shadow:0 0 18px rgba(186,255,124,.06)}.sticker.locked{opacity:.35;filter:grayscale(1)}.sticker-mark{font-size:20px}.sticker-name{font-size:8px;color:#aaa;margin-top:4px;font-weight:900}

.league-board{display:grid;grid-template-columns:1fr 1fr;gap:12px}.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px}.podium-item{border:1px solid #272727;background:#0d0d0d;border-radius:12px;padding:10px;text-align:center}.podium-item:nth-child(2){min-height:150px;border-color:#3e5530}.podium-item strong{display:block;font-size:9px}.podium-item span{display:block;font-size:8px;color:#777;margin-top:3px}.invest{display:flex;gap:8px;align-items:center}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile-photo{width:82px;height:82px;border-radius:20px;border:1px solid #2d2d2d;background:#0b0b0b;object-fit:cover}.option-grid{display:flex;flex-wrap:wrap;gap:7px}.option-tile{padding:9px 10px;border:1px solid #262626;border-radius:11px;background:#0c0c0c;cursor:pointer;font-size:9px;color:#aaa}.option-tile.active{border-color:#3c5330;background:#17200f;color:#dfffca}.map-wrap{border:1px solid #252525;border-radius:15px;background:radial-gradient(circle at 50% 40%,rgba(186,255,124,.08),transparent 55%),#0b0b0b;padding:12px}.state-map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.state-tile{border:1px solid #202020;border-radius:8px;padding:7px 4px;text-align:center;background:#0e0e0e;color:#777;font-size:8px;cursor:pointer}.state-tile:hover,.state-tile.active{background:#17200f;border-color:#385127;color:#dfffca}.map-note{font-size:8px;color:#666;line-height:1.5;margin-top:8px}.terms-row{display:flex;align-items:flex-start;gap:8px;margin-top:11px;font-size:9px;color:#777;line-height:1.45}.terms-row input{accent-color:var(--green);margin-top:2px}.link-button{border:0;background:none;color:#dfffc0;padding:0;text-decoration:underline}.support-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.icon-tile{border:1px solid #252525;border-radius:13px;background:#0d0d0d;padding:12px;text-align:center;cursor:pointer}.icon-tile:hover{border-color:#405636;box-shadow:0 0 20px rgba(186,255,124,.08);transform:translateY(-1px)}.icon-tile .icon{font-size:20px}.icon-tile span{display:block;font-size:8px;color:#777;margin-top:5px}.light-theme{--bg:#f4f5f2;--panel:#fff;--card:#fff;--line:#d9ddd4;--text:#111;--muted:#686d66;--muted2:#8d928a}.light-theme body{background:var(--bg)}.light-theme .sidebar,.light-theme .modal,.light-theme .card,.light-theme .login-box{background:#fff}.light-theme .input,.light-theme .select,.light-theme .day,.light-theme .metric,.light-theme .stat,.light-theme .mini-box,.light-theme .news-card,.light-theme .team-card,.light-theme .choice-card,.light-theme .group-card,.light-theme .premium-card{background:#f8f9f6;color:#111}.light-theme .nav-btn{color:#596056}.light-theme .table th{color:#73796f}
@media(max-width:760px){.calendar-grid{gap:4px}.day{min-height:66px;padding:5px}.day-event{font-size:6px}.day-sticker{font-size:13px}.team-grid,.league-board,.support-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.icon-grid{grid-template-columns:repeat(3,1fr)}.state-map{grid-template-columns:repeat(5,1fr)}.sticker-grid{grid-template-columns:repeat(3,1fr)}}
/* ZONA V.01 MICRO POLISH */
.social-icon svg{width:14px;height:14px;display:block}.social-link:hover .social-icon{color:var(--green);filter:drop-shadow(0 0 5px rgba(186,255,124,.45))}
.fire{color:var(--green)!important;font-size:21px;filter:drop-shadow(0 0 7px rgba(186,255,124,.35));animation:firePulse 1.8s ease-in-out infinite}
@keyframes firePulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
.modal-backdrop{overflow:auto}.modal{overscroll-behavior:contain}.sticker.locked{position:relative}

.btn.is-loading{position:relative;pointer-events:none;opacity:.78}
.btn.is-loading:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid rgba(0,0,0,.22);border-top-color:currentColor;border-radius:50%;animation:zonaSpin .7s linear infinite}
.btn-secondary.is-loading:before{border-color:rgba(255,255,255,.18);border-top-color:#fff}
@keyframes zonaSpin{to{transform:rotate(360deg)}}
.save-feedback{margin-top:8px;font-size:9px;color:var(--green);min-height:14px}

.coin-visual{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;background:radial-gradient(circle at 32% 26%,#fff7ad 0%,#f6d75e 18%,#d7a82f 42%,#8c6010 72%,#332208 100%);border:2px solid #f4d772;box-shadow:inset 0 0 0 2px #7b5108,0 0 18px rgba(240,199,75,.34),inset 0 0 14px rgba(255,255,220,.45);animation:coinGlow 2.6s ease-in-out infinite}
.coin-visual:before{content:"Z";font-size:12px;font-weight:1000;color:#13220c;text-shadow:0 1px 0 rgba(255,255,255,.28)}
.coin-visual:after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.28);border-radius:50%}
@keyframes coinGlow{0%,100%{transform:translateY(0) rotate(0deg);filter:brightness(1)}50%{transform:translateY(-1px) rotate(4deg);filter:brightness(1.12)}}

</head>
<body>

<main>
  <header class="topbar">

<a class="social-link" href="#" aria-label="LinkedIn" onclick="socialPlaceholder(event,'LinkedIn')"><span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 7.2A2.1 2.1 0 1 1 5 3a2.1 2.1 0 0 1 0 4.2ZM3.2 8.8h3.6V21H3.2V8.8Zm5.8 0h3.4v1.67h.05c.47-.9 1.62-1.95 3.35-1.95 3.58 0 4.24 2.36 4.24 5.44V21h-3.6v-6.24c0-1.49-.03-3.41-2.08-3.41-2.08 0-2.4 1.62-2.4 3.29V21H9V8.8Z"></path></svg></span> LinkedIn</a>

</div>
      <div class="account" id="accountButton"><div class="avatar" id="avatar">A</div><div><div class="account-name" id="accountName">Admin</div><div class="account-role" id="accountRole">Administrador</div></div></div>
    </div>
  </header>

  <section class="page active" id="home">
    <div class="hero">
      <div class="card hero-main">
        <div class="eyebrow">ZONA HUB</div>
        <div class="hero-title">Sua carreira entra em modo ZONA.</div>
        <div class="hero-copy">Um centro de comando para acompanhar concursos, questões, desempenho, cronogramas e rotina de preparação sem depender de cinco planilhas diferentes.</div>
        <div class="hero-actions"><button class="btn btn-primary" onclick="goTo('dashboard')">ABRIR DASHBOARD</button><button class="btn btn-secondary" onclick="openContestModal()">+ NOVO CONCURSO</button></div>
      </div>
      <div class="card active-card">
        <div><div class="eyebrow">Agora</div><div class="active-name" id="homeContest">Nenhum concurso ativo</div><div class="active-meta" id="homeContestMeta">Adicione um edital para começar.</div><div class="mini-grid" id="homeQuick"></div></div>
        <button class="btn btn-secondary" onclick="goTo('questoes')">REGISTRAR QUESTÕES</button>
      </div>
    </div>

      <div class="stat"><div class="stat-label">Acerto</div><div class="stat-value" id="homeAccuracy">0%</div></div>
      <div class="stat"><div class="stat-label">Horas</div><div class="stat-value" id="homeHours">0.0h</div></div>
      <div class="stat"><div class="stat-label">Índice</div><div class="stat-value" id="homeIndex">0</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="section-head"><div><div class="section-title">Ritmo ZONA</div><div class="section-copy">Quanto mais você usa a plataforma, mais sua sequência e suas LIBS crescem.</div></div><span class="tag" id="homeLeagueTag">SEM LIGA</span></div>
      <div class="usage-strip"><span class="fire" style="font-size:24px" aria-label="sequência ZONA">ϟ</span><div><div class="usage-number" id="homeStreak">0 dias</div><div class="usage-copy">sequência</div></div><div class="coin-visual" style="width:38px;height:38px" aria-label="LIBS"><svg viewBox="0 0 100 100" role="img" aria-hidden="true"><defs><radialGradient id="cg" cx="30%" cy="25%"><stop offset="0%" stop-color="#fff6a8"/><stop offset="24%" stop-color="#f8d95c"/><stop offset="60%" stop-color="#c18d20"/><stop offset="100%" stop-color="#6f4709"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="50" cy="50" r="46" fill="url(#cg)" stroke="#f6dc77" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="#101010" stroke="#8e6518" stroke-width="2"/><path d="M31 63c4-14 11-27 25-31 8-2 15 0 19 6-2 8-8 10-14 9 2 5 0 12-5 17-3 3-7 5-10 5-4 0-8-2-10-6l-3 3z" fill="#d4a62f" stroke="#e9d167" stroke-width="1.2" filter="url(#glow)"/><circle cx="69" cy="40" r="3" fill="#baff7c"/><path d="M49 69c8 7 18 7 23 0 3-4 2-8-1-10-4-3-8-1-8 3 0 3 3 4 5 2" fill="none" stroke="#baff7c" stroke-width="2" stroke-linecap="round"/><path d="M35 54l10-4-4-6 14 5-9 4 4 6z" fill="#baff7c" opacity=".9"/></svg></div><div><div class="usage-number" id="homeCoins">0 LIBS</div><div class="usage-copy">moeda ZONA</div></div><div style="margin-left:auto"><button class="btn btn-secondary" onclick="goTo('ligas')">VER LIGA</button></div></div>

        <div class="card" style="background:#0c0c0c"><div class="section-head"><div><div class="section-title">Por matéria</div><div class="section-copy">O indicador evolui toda vez que você registra novas questões.</div></div></div><div class="subject-list" id="subjectPerformance"></div></div>

      </div>

    var activeDays={};db.questions.forEach(function(q){var t=new Date(q.date).getTime();if(t>=d14)activeDays[q.date]=1});

  window.changeMonth=function(dir){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+dir,1);renderAgenda()}
  var editingDayKey="",editingSticker="";
  function renderStickerGrid(){
    var box=document.getElementById("stickerGrid");if(!box)return;
    var max=coinsPerPlan();
    box.innerHTML=STICKERS.map(function(s,i){
      var unlocked=i<max;
      var b=document.createElement("button");
      b.type="button";b.className="sticker"+(unlocked?"":" locked");
      b.innerHTML='<div class="sticker-mark">'+s[0]+'</div><div class="sticker-name">'+s[1]+'</div>'+(unlocked?"":"<div class=\"tiny\">PLANO</div>");
      if(unlocked)b.addEventListener("click",function(){editingSticker=s[0];document.querySelectorAll("#stickerGrid .sticker").forEach(function(el){el.style.outline="none"});b.style.outline="1px solid var(--green)"});
      else b.addEventListener("click",function(){notify("Adesivo bloqueado","Faça upgrade do plano para liberar este adesivo.","error")});
      box.appendChild(b);
    });
  }
  window.openDayEditor=function(key){
    editingDayKey=key;var current=(profile.agenda||{})[key]||{};editingSticker=current.sticker||"";
    document.getElementById("dayEditorTitle").textContent=new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"2-digit",month:"long"}).format(new Date(key+"T12:00:00"));
    document.getElementById("dayNoteInput").value=current.note||"";
    document.getElementById("dayEditorBackdrop").classList.add("open");
    renderStickerGrid();
    document.querySelectorAll("#stickerGrid .sticker").forEach(function(el){el.style.outline="none";if(el.querySelector(".sticker-mark")&&el.querySelector(".sticker-mark").textContent===editingSticker)el.style.outline="1px solid var(--green)"});
  };
  window.closeDayEditor=function(){document.getElementById("dayEditorBackdrop").classList.remove("open");editingDayKey="";editingSticker=""};
  window.saveDayEditor=function(){
    if(!editingDayKey)return;var note=document.getElementById("dayNoteInput").value.trim();profile.agenda=profile.agenda||{};
    if(!note&&!editingSticker)delete profile.agenda[editingDayKey];else profile.agenda[editingDayKey]={note:note,sticker:editingSticker};
    saveProfileLocal();closeDayEditor();renderAgenda();touchUsage(2);notify("Agenda atualizada","Seu dia foi salvo na AGENDA ZONA.");
  };
  window.removeDayEditor=function(){if(!editingDayKey)return;profile.agenda=profile.agenda||{};delete profile.agenda[editingDayKey];saveProfileLocal();closeDayEditor();renderAgenda();notify("Dia limpo","As anotações e o adesivo foram removidos.")};
  window.openDayEditor=openDayEditor;
  function renderProfile(){
    var pp=document.getElementById("profilePhotoPreview");if(pp&&profile.photo)pp.src=profile.photo;
    var ids={profileName:profile.name||"",profileEmail:profile.email||"",profileTarget:profile.target||""};Object.keys(ids).forEach(function(id){var e=document.getElementById(id);if(e)e.value=ids[id]});
    var apps=document.getElementById("appsOptions"),g=document.getElementById("genderOptions"),q=document.getElementById("quotaOptions");
    if(apps)apps.innerHTML=QUESTION_APPS.map(function(x){return '<button type="button" class="option-tile '+(profile.apps.indexOf(x[0])>=0?"active":"")+'" onclick="toggleProfileOption(\'apps\',\''+x[0].replace(/'/g,"&#39;")+'\')">'+x[1]+" "+x[0]+"</button>"}).join("");
    if(g)g.innerHTML=GENDERS.map(function(x){return '<button type="button" class="option-tile '+(profile.gender===x[0]?"active":"")+'" onclick="profile.gender=\''+x[0]+'\';renderProfile()">'+x[1]+" "+x[0]+"</button>"}).join("");
    if(q)q.innerHTML=QUOTAS.map(function(x){return '<button type="button" class="option-tile '+(profile.quotas.indexOf(x)>=0?"active":"")+'" onclick="toggleProfileOption(\'quotas\',\''+x.replace(/'/g,"&#39;")+'\')">'+x+"</button>"}).join("");
    renderLocationSelectors();
    var th=document.getElementById("profileTheme");if(th)th.value=profile.theme||"dark"
  }
  window.toggleProfileOption=function(key,val){var arr=profile[key]||[];var i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);profile[key]=arr;renderProfile()}
  function renderLocationSelectors(){
    var r=document.getElementById("profileRegion"),s=document.getElementById("profileState"),ci=document.getElementById("profileCity"),map=document.getElementById("stateMap");if(!r||!s||!ci)return;
    r.innerHTML='<option value="">Região</option>'+Object.keys(LOCATIONS).map(function(x){return '<option '+(profile.region===x?"selected":"")+'>'+x+"</option>"}).join("");
    var region=profile.region;var states=region?Object.keys(LOCATIONS[region]):Object.keys(STATE_CODES);
    s.innerHTML='<option value="">Estado</option>'+states.map(function(x){return '<option '+(profile.state===x?"selected":"")+' value="'+x+'">'+x+"</option>"}).join("");
    var cities=region&&profile.state&&LOCATIONS[region][profile.state]?LOCATIONS[region][profile.state]:[];ci.innerHTML='<option value="">Cidade</option>'+cities.map(function(x){return '<option '+(profile.city===x?"selected":"")+'>'+x+"</option>"}).join("");
    if(map)map.innerHTML=Object.keys(STATE_CODES).map(function(st){return '<button type="button" class="state-tile '+(profile.state===st?"active":"")+'" onclick="pickState(\''+st+'\')">'+st+"</button>"}).join("");
  }
  window.pickState=function(st){profile.state=st;profile.region=STATE_CODES[st];profile.city="";renderProfile()}
  document.getElementById("profileRegion")?.addEventListener("change",function(){profile.region=this.value;profile.state="";profile.city="";renderProfile()});
  document.getElementById("profileState")?.addEventListener("change",function(){profile.state=this.value;profile.city="";renderProfile()});
  document.getElementById("profileCity")?.addEventListener("change",function(){profile.city=this.value});
  document.getElementById("profilePhoto")?.addEventListener("change",function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){profile.photo=rd.result;renderProfile()};rd.readAsDataURL(f)});
  document.getElementById("profileTheme")?.addEventListener("change",function(){profile.theme=this.value;applyTheme()});
  function applyTheme(){document.documentElement.classList.toggle("light-theme",profile.theme==="light");localStorage.setItem("ZONA_THEME_V1",profile.theme)}
  window.saveProfile=function(){profile.name=document.getElementById("profileName").value.trim();profile.email=document.getElementById("profileEmail").value.trim();profile.target=document.getElementById("profileTarget").value.trim();var np=document.getElementById("newPassword").value;if(np){localStorage.setItem("ZONA_LOCAL_PASSWORD_"+(currentUser.role||"user"),np)}profile.theme=document.getElementById("profileTheme").value;applyTheme();saveProfileLocal();var an=document.getElementById("accountName");if(an&&profile.name)an.textContent=profile.name;notify("Perfil salvo","Suas preferências foram atualizadas neste navegador.");updateUsageUI()}
  function openPremium(){document.getElementById("premiumBackdrop").classList.add("open")}
  window.openPremium=openPremium;
  function joinCommunity(){notify("Comunidade ZONA","Configure o link oficial do WhatsApp na próxima etapa do site.")}
  window.joinCommunity=joinCommunity;
  function openFeedback(){var subj=document.getElementById("supportSubject").value||"Feedback ZONA";var msg=document.getElementById("supportMessage").value||"";var mail="mailto:CONFIGURE_EMAIL@zonahub.com?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(msg);window.location.href=mail}
  window.openFeedback=openFeedback;
  function bePartner(){notify("Sócio ZONA","A área está pronta. O link de doação/PIX será conectado quando você definir o canal oficial.")}
  window.bePartner=bePartner;
  function closeTerms(){document.getElementById("termsBackdrop").classList.remove("open")}
  window.closeTerms=closeTerms;
  document.getElementById("termsButton")?.addEventListener("click",function(){document.getElementById("termsBackdrop").classList.add("open")});
  function updateFromContest(){var c=currentContest();if(c){var ed=c.editalData||{};var d=document.getElementById("dashContestTitle");if(d)d.textContent=c.name}}
  var _renderAll=renderAll;
  renderAll=function(){_renderAll();updateUsageUI();renderLeague();renderAgenda();};
  document.getElementById("loginForm")?.addEventListener("submit",function(){setTimeout(function(){touchUsage(5);renderLeaguePicker();maybeChooseLeague();renderProfile()},100)});
  // Image news upgrade
  var _loadNews=loadNews;
  loadNews=async function(){var grid=document.getElementById("newsGrid");if(!grid)return;grid.innerHTML='<div class="empty">Atualizando radar...</div>';try{var base="https://news.google.com/rss/search?q="+encodeURIComponent("concursos públicos "+(profile.region||"Brasil"))+"&hl=pt-BR&gl=BR&ceid=BR:pt-419";var rr=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(base));var jj=await rr.json();var items=(jj.items||[]).slice(0,6);if(!items.length)throw new Error("empty");grid.innerHTML=items.map(function(n){var img=n.thumbnail||(n.enclosure&&n.enclosure.link)||"";return '<article class="news-card">'+(img?'<img src="'+esc(img)+'" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:11px;margin-bottom:9px">':'')+'<span class="news-tag">RADAR</span><div class="news-title">'+esc(n.title)+'</div><div class="news-meta">'+esc(n.pubDate||"Atualização")+'</div><a class="news-link" href="'+esc(n.link)+'" target="_blank" rel="noopener">ABRIR MATÉRIA →</a></article>'}).join("")}catch(e){_loadNews()}};
  loadNews=_loadNews;
  updateUsageUI();applyTheme();renderLeaguePicker();renderProfile();renderAgenda();


  // ===== QUESTION CRUD + GOD MODE =====
  var editingQuestionId=null;
  function refreshAdminUI(){
    var adm=currentUser&&currentUser.role==="Administrador";
    document.querySelectorAll(".admin-only").forEach(function(e){e.classList.toggle("visible",!!adm)});
    var qs=document.getElementById("adminQuestions"),ss=document.getElementById("adminSessions"),cc=document.getElementById("adminCoins");
    if(qs)qs.textContent=db.questions.length;if(ss)ss.textContent=db.sessions.length;if(cc)cc.textContent=game.coins;
    var ap=document.getElementById("adminPlan");if(ap)ap.value=localStorage.getItem("ZONA_PLAN")||"FREE";
    var al=document.getElementById("adminLeague");if(al)al.value=game.league||"";
    var ch=JSON.parse(localStorage.getItem(CHALLENGE_KEY)||"null"),cp=document.getElementById("adminChallengePreview");if(cp)cp.textContent=ch?(ch.title+" • "+ch.reward+" LIBS"):"Nenhum desafio publicado.";
  }
  function isAdmin(){return currentUser&&currentUser.role==="Administrador"}
  function ensureAdmin(){if(!isAdmin()){notify("Área restrita","Somente o Administrador pode usar o MODO DEUS.","error");return false}return true}
  window.adminCoins=function(){
    if(!ensureAdmin())return;
    var n=Number(document.getElementById("adminCoinAmount").value)||0,a=document.getElementById("adminCoinAction").value;
    if(n<0){notify("Valor inválido","Informe uma quantidade válida.","error");return}
    if(a==="add")game.coins+=n;else if(a==="remove")game.coins=Math.max(0,game.coins-n);else game.coins=n;
    saveGame();updateUsageUI();refreshAdminUI();notify("Economia atualizada","Saldo atual: "+game.coins+" LIBS.");
  };
  window.adminAccessSave=function(){if(!ensureAdmin())return;var plan=document.getElementById("adminPlan").value,league=document.getElementById("adminLeague").value;localStorage.setItem("ZONA_PLAN",plan);game.league=league||null;saveGame();updateUsageUI();renderAll();refreshAdminUI();notify("Acesso atualizado","Plano: "+plan+". Liga: "+(league||"sem liga")+".")};
  window.adminRecalculate=function(){if(!ensureAdmin())return;renderAll();notify("Performance recalculada","Os indicadores foram atualizados a partir dos registros atuais.")};
  window.adminExport=function(){if(!ensureAdmin())return;var payload={database:db,game:game,profile:profile,plan:localStorage.getItem("ZONA_PLAN")||"FREE"};var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(payload,null,2));a.download="zona-hub-backup.json";a.click();notify("Backup gerado","O arquivo JSON foi preparado para exportação.")};
  window.adminClearQuestions=function(){if(!ensureAdmin())return;if(!confirm("Apagar todos os registros de questões? Esta ação não pode ser desfeita."))return;db.questions=[];saveDB();renderAll();refreshAdminUI();notify("Questões apagadas","O histórico de questões foi zerado.")};
  window.adminReset=function(){if(!ensureAdmin())return;if(!confirm("Resetar todos os dados locais do ZONA HUB?"))return;localStorage.removeItem(DB_KEY);localStorage.removeItem(GAME_KEY);localStorage.removeItem(PROFILE_KEY);localStorage.removeItem("ZONA_PLAN");location.reload()};

  function buildEditSubjectSelect(current){
    var el=document.getElementById("editQuestionSubject");if(!el)return;el.innerHTML="";
    refreshSelects();var source=document.getElementById("questionSubject");if(source){Array.from(source.options).forEach(function(o){el.appendChild(o.cloneNode(true))})}
    if(current)el.value=current;if(el.value!==current&&current){var op=document.createElement("option");op.value=current;op.textContent=current;el.appendChild(op);el.value=current}
  }
  window.openQuestionEdit=function(id){var q=db.questions.find(function(x){return String(x.id)===String(id)});if(!q)return;editingQuestionId=String(id);buildEditSubjectSelect(q.subject);document.getElementById("editQuestionTotal").value=q.total;document.getElementById("editQuestionCorrect").value=q.correct;document.getElementById("questionEditBackdrop").classList.add("open")};
  window.closeQuestionEdit=function(){document.getElementById("questionEditBackdrop").classList.remove("open");editingQuestionId=null};
  window.saveQuestionEdit=function(){var q=db.questions.find(function(x){return String(x.id)===editingQuestionId});if(!q)return;var s=document.getElementById("editQuestionSubject").value,t=Number(document.getElementById("editQuestionTotal").value),co=Number(document.getElementById("editQuestionCorrect").value);if(!s||t<1||co<0||co>t){notify("Registro inválido","Confira matéria, total e acertos.","error");return}q.subject=s;q.total=t;q.correct=co;saveDB();closeQuestionEdit();renderAll();notify("Questão atualizada","O registro foi corrigido sem apagar os demais dados.")};
  window.deleteEditingQuestion=function(){if(!editingQuestionId)return;deleteQuestion(editingQuestionId);closeQuestionEdit()};
  window.deleteQuestion=function(id){var q=db.questions.find(function(x){return String(x.id)===String(id)});if(!q)return;if(!confirm("Excluir o registro de "+q.subject+"?"))return;db.questions=db.questions.filter(function(x){return String(x.id)!==String(id)});saveDB();renderAll();notify("Registro excluído","A atividade de "+q.subject+" foi removida do histórico.")};

  // Replace question renderer with CRUD actions.
  var _renderQuestions=renderQuestions;
  renderQuestions=function(){
    var tb=document.getElementById("questionTable");
    if(!db.questions.length){tb.innerHTML='<tr><td colspan="6" class="muted">Nenhum resultado registrado.</td></tr>';return}
    tb.innerHTML=db.questions.slice().reverse().map(function(q){var p=q.total?Math.round(q.correct/q.total*100):0;return '<tr><td>'+esc(fmtDate(q.date))+'</td><td>'+esc(q.subject)+'</td><td>'+q.total+'</td><td>'+q.correct+'</td><td>'+p+'%</td><td><div class="row-actions"><button class="icon-btn" onclick="openQuestionEdit(\\\''+String(q.id)+'\\\')" title="Editar">✎</button><button class="icon-btn danger" onclick="deleteQuestion(\\\''+String(q.id)+'\\\')" title="Excluir">×</button></div></td></tr>'}).join("");
  };

  // Add loading state to question save.
  var questionHandler=document.getElementById("questionForm");
  if(questionHandler){
    questionHandler.addEventListener("submit",function(){
      var btn=questionHandler.querySelector('button[type="submit"]');
      if(btn&&!btn.disabled){btn.disabled=true;btn.classList.add("is-loading");btn.textContent="SALVANDO...";setTimeout(function(){if(btn){btn.disabled=false;btn.classList.remove("is-loading");btn.textContent="SALVAR RESULTADO"}},650)}
    },true);
  }

  // Username + profile controls.
  function hydrateUsername(){
    var el=document.getElementById("profileUsername");if(el)el.value=profile.username||((currentUser&&currentUser.username)||"");
  }
  var _renderProfileOld=renderProfile;
  renderProfile=function(){_renderProfileOld();hydrateUsername()};
  var _saveProfileOld=window.saveProfile;
  window.saveProfile=function(){
    profile.username=(document.getElementById("profileUsername")||{}).value?document.getElementById("profileUsername").value.trim():"";
    _saveProfileOld();
    if(profile.username){var an=document.getElementById("accountName");if(an)an.textContent=profile.username}
  };
  var _showAppOld=showApp;
  // showApp will be followed by admin UI refresh via timeout in case of early execution.
  setTimeout(function(){refreshAdminUI();renderProfile();},0);

  // Add admin page to page-name mapping.
  var _goTo=goTo;
  goTo=function(page){_goTo(page);if(page==="admin")refreshAdminUI()};
  window.goTo=goTo;

</script>
</body>
</html>
